name: CI

# Setiap PR dan push ke main: lint, typecheck, lalu build dan tes Playwright + axe-core di ponsel
# dan desktop (ADR-0021). Laporan Playwright diunggah bila tes gagal.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Pasang Chromium untuk Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Build dan tes aksesibilitas
        run: pnpm test:a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
